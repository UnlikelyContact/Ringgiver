name: web build

on:
  push:
    branches: ["main"]
    paths: ["game/**", "scripts/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot
        run: bash scripts/setup-godot.sh
      - name: Cache web export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.5.stable
          key: godot-4.5-web-templates
      - name: Install web export templates
        run: bash scripts/setup-web-templates.sh
      - name: Export
        run: bash scripts/export-web.sh
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000  # Pages file sync has stalled past the 10-minute default before
