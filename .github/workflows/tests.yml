name: tests

on:
  push:
    paths: ["game/**", "scripts/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["game/**", "scripts/**", ".github/workflows/tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot and build class cache
        run: bash scripts/setup-godot.sh
      - name: Run headless tests
        run: scripts/test.sh
